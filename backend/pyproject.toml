[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foodhealth-backend"
version = "0.1.0"
description = "Food & Health Planner - Backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "alembic",
    # zoneinfo braucht auf Windows (und in schlanken Images) eine tzdata-Quelle
    "tzdata",
    # Phase 1: Importer und Uploads
    "pdfplumber",
    "python-multipart",
    # Phase 2: BLS-Import (xlsx), Rezeptimport, Zutaten-Zuordnung
    "openpyxl",
    "recipe-scrapers",
    "rapidfuzz",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
